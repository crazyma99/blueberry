<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=375,initial-scale=1">
<style>
  /* 与产物 wxss 一致（750 设计稿按 0.5 折算 px） */
  body { margin: 0; background: #160F04; font-family: sans-serif; }
  .photoItem { width: 351px; height: 241px; position: relative; margin: 12px; overflow: hidden; border: 1px solid rgba(241,205,145,.3); border-radius: 7px; }
  .photo { width: 100%; height: 100%; background: linear-gradient(160deg, #6b5a44, #2a2016); }
  .mask { position: absolute; width: 100%; height: 100%; top: 0; left: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,.45) 75%, rgba(0,0,0,.85) 100%); }
  .desc { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; flex-direction: row; align-items: center; }
  .desc-main { flex: 1; display: flex; flex-direction: column; min-width: 0; margin-right: 4px; }
  .desc-tryon { flex-shrink: 0; display: flex; align-items: center; }
  .desc .photoName { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #F1CD91; font-size: 16px; }
  .desc-row { margin-top: 5px; display: flex; flex-direction: row; justify-content: space-between; align-items: center; }
  .collect { position: relative; display: flex; flex-direction: row; align-items: center; color: #F1CD91; font-size: 13px; }
  .heart { width: 18px; height: 15px; }
  .stat-count { margin-left: 5px; }
  .ai-tryon-tag { width: 62px; height: 24px; }
  .tag { background: linear-gradient(135deg,#FFDF9F,#F1CD91 45%,#D9A75C); border-radius: 12px; color:#160F04; font-size: 13px; text-align:center; line-height: 24px; }
  .lbl { color:#8a7350; font-size: 11px; margin: 6px 0 2px 12px; }
</style></head>
<body>
  <div class="lbl">修复后（当前 main / v1.0.56）：AI 按钮与「标题+点赞」整块垂直居中</div>
  <div class="photoItem"><div class="photo"></div><div class="mask">
    <div class="desc">
      <div class="desc-main">
        <div class="photoName">手推波旗袍</div>
        <div class="desc-row"><div class="collect"><img class="heart" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 20'><path fill='%23F1CD91' d='M12 20S0 12 0 6a5 5 0 0 1 9-3 5 5 0 0 1 3-3 5 5 0 0 1 0 10z'/></svg>"><span class="stat-count">2</span></div></div>
      </div>
      <div class="desc-tryon"><div class="ai-tryon-tag tag">AI试衣</div></div>
    </div>
  </div></div>
  <div class="lbl">修复前（旧版）：AI 按钮与点赞同一行 ⇒ 视觉上偏下</div>
  <div class="photoItem"><div class="photo"></div><div class="mask">
    <div class="desc" style="display:flex;flex-direction:column;align-items:stretch">
      <div class="photoName" style="color:#F1CD91;font-size:16px">手推波旗袍</div>
      <div class="desc-row">
        <div class="collect"><img class="heart" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 20'><path fill='%23F1CD91' d='M12 20S0 12 0 6a5 5 0 0 1 9-3 5 5 0 0 1 3-3 5 5 0 0 1 0 10z'/></svg>"><span class="stat-count">2</span></div>
        <div><div class="ai-tryon-tag tag">AI试衣</div></div>
      </div>
    </div>
  </div></div>
</body></html>
